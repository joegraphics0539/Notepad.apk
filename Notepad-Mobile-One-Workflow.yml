        run: |
          mkdir -p app/src/main/java/com/joesticks/notepad app/src/main/assets app/src/main/res/values
          printf '%s' "$HTML_B64" | base64 -d > app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name='NotepadAPK'
include ':app'
EOF
          cat > build.gradle <<'EOF'
plugins { id 'com.android.application' version '8.7.3' apply false }
EOF
          cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
EOF
          cat > app/build.gradle <<'EOF'
plugins { id 'com.android.application' }
android { namespace 'com.joesticks.notepad'; compileSdk 35; defaultConfig { applicationId 'com.joesticks.notepad'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' } }
EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme" android:label="Notepad"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
<resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:statusBarColor">#FFFFFF</item><item name="android:windowLightStatusBar">true</item></style></resources>
EOF
          cat > app/src/main/java/com/joesticks/notepad/MainActivity.java <<'EOF'
package com.joesticks.notepad;
import android.app.Activity; import android.os.Bundle; import android.webkit.*;
public class MainActivity extends Activity { WebView w; public void onCreate(Bundle b){super.onCreate(b); w=new WebView(this); setContentView(w); w.setWebViewClient(new WebViewClient()); WebSettings s=w.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); w.loadUrl("file:///android_asset/index.html");} public void onBackPressed(){if(w.canGoBack())w.goBack();else super.onBackPressed();}}
EOF
      - name: Build
        run: gradle wrapper --gradle-version 8.11.1 && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Notepad-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
